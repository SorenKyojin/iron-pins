<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestionnaire de taches</title>
    <link rel="stylesheet" href="style.css">

</head>

<body>
    <header>
        <div class="flex fb-align-center">
            <h1>Pins</h1>
            <div class="separator"></div>
            <h1 id="table-name"></h1>
        </div>
        <div>
            <button id="board-menu-btn">Tableau...</button>
        </div>
    </header>
    <div class="table-menu hidden">
        <button class="menu-btn">Nouveau</button>
        <button class="menu-btn">Fermer</button>
        <button class="menu-btn">Supprimer</button>
        <div class="h-separator"></div>
    </div>
    <div class="flex top-bar">
        <button id="new-pin-btn" class="btn-alt">Nouveau Pin</button>
        <div class="search-container">
            <input type="text" id="search-bar" name="Rechercher" placeholder="Mots-clés">
            <button type="submit" id="search-submit" class="btn-clear">Rechercher</button>
        </div>
    </div>
    <form action="post" id="new-pin" class="hidden">
        <label for="titre">Titre</label>
        <input id="titre" required>
        <label for="description">Description</label>
        <textarea id="description">Description</textarea>
        <label for="statut">Choisir un statut</label>
        <select name="statut" id="statut">
            <option value="todo">À faire</option>
            <option value="progress">En cours</option>
            <option value="done">Terminées</option>
            <option value="blocked">Bloquées</option>
        </select>
        <label for="couleur">Couleur</label>
        <select name="color" id="couleur">
            <option value="yellow">Jaune</option>
            <option value="blue">Bleu</option>
            <option value="red">Rouge</option>
            <option value="green">Vert</option>
            <option value="purple">Violet</option>
        </select>
        <button type="submit" id="submit-new-pin-data" class="btn-alt">Créer un pin</button>
    </form>
    <main id="pinboard"></main>
</body>
<script src="main.js"></script>
</html>
